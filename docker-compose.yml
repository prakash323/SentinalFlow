# SentinelFlow: the full stack in Docker.
#
#   copy .env.example .env      (once; set DB_PASSWORD and the other values)
#   docker compose up -d --build
#
# Host-side ports:
#   Console     http://localhost:5173  (nginx; proxies /api to the backend)
#   Backend     http://localhost:8080  (Swagger: /swagger-ui.html)
#   ML service  http://localhost:8000  (/health)
#   PostgreSQL  localhost:5432
#   Kafka       localhost:9094         (for host clients, e.g. the physical collector)
#
# The in-network listener kafka:9092 is only for other containers; a process
# on the host must use localhost:9094 (advertised as PLAINTEXT_HOST below).
#
# This file reproduces the containers this project was already running
# (project name "sentinelflow", volumes sentinelflow_postgres-data and
# sentinelflow_kafka-data), so `docker compose up -d` re-attaches to the
# existing data instead of starting empty.
#
# Do not run the backend, ML service or console on the host at the same time:
# they would clash on ports 8080/8000/5173, and two backends would split the
# Kafka consumer group's partitions.
name: sentinelflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: anomaly_platform
      POSTGRES_USER: anomaly
      # Only applied when the data volume is first initialised; changing it later does not change the real password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    environment:
      TZ: UTC
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ml-service:
    build: ./ml-service/anomaly-detection
    environment:
      ML_DEPLOYMENT_TZ: ${ML_DEPLOYMENT_TZ:-UTC}
      ML_DEDUP_CACHE_SIZE: ${ML_DEDUP_CACHE_SIZE:-10000}
    ports:
      - "8000:8000"
    # Healthy only once the model has finished warming up (Dockerfile HEALTHCHECK).
    restart: unless-stopped

  backend:
    build: ./backend/backend
    # Credentials, login accounts and the optional OPENROUTER_* settings. Variables
    # not set in .env fall back to the defaults in application.yml.
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/anomaly_platform?options=-c%20TimeZone%3DUTC
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # While ML warms up it answers 503; the consumer retries for ~5 min and then
      # dead-letters the event, so wait for a ready model rather than a started one.
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
